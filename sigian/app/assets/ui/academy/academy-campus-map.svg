<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mappa illustrata dell'Accademia SIGIAN</title>
  <desc id="desc">Campus arcano con torre centrale, ala monumentale, osservatorio, forgia vulcanica, bastione delle prove e arena.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eadcb8"/>
      <stop offset=".5" stop-color="#cdb78b"/>
      <stop offset="1" stop-color="#8c744f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5d98a" stop-opacity=".92"/>
      <stop offset="1" stop-color="#f5d98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lava" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#ffd06a"/>
      <stop offset=".36" stop-color="#d86b32"/>
      <stop offset="1" stop-color="#4f2b24"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73634f"/>
      <stop offset="1" stop-color="#3f392f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f352c"/>
      <stop offset="1" stop-color="#2c2430"/>
    </linearGradient>
    <linearGradient id="tealRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#426d6e"/>
      <stop offset="1" stop-color="#253e43"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2e241c" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#paper)"/>
  <path d="M0 104C170 28 250 58 365 110S615 176 760 104 1050 18 1200 86V0H0Z" fill="#66785b" opacity=".34"/>
  <path d="M0 620c132-54 252-60 372-16s208 42 333 2 297-52 495 8v146H0Z" fill="#4f5945" opacity=".38"/>

  <g opacity=".34" fill="none" stroke="#6c593c" stroke-width="10" stroke-linecap="round">
    <path d="M602 365C530 316 412 259 274 210"/>
    <path d="M620 350C716 290 826 237 938 196"/>
    <path d="M565 390C447 419 311 474 190 548"/>
    <path d="M640 400C742 443 864 500 1009 553"/>
    <path d="M596 430C548 514 505 581 435 647"/>
  </g>
  <g opacity=".35" fill="#725c3d">
    <circle cx="602" cy="365" r="10"/><circle cx="274" cy="210" r="7"/><circle cx="938" cy="196" r="7"/>
    <circle cx="190" cy="548" r="7"/><circle cx="1009" cy="553" r="7"/><circle cx="435" cy="647" r="7"/>
  </g>

  <!-- Atrium tower -->
  <g transform="translate(505 225)" filter="url(#shadow)">
    <ellipse cx="100" cy="178" rx="130" ry="42" fill="#30291f" opacity=".3"/>
    <circle cx="100" cy="86" r="112" fill="url(#glow)" opacity=".5"/>
    <path d="M26 166h148l-12-102H38Z" fill="url(#stone)" stroke="#b7a47d" stroke-width="5"/>
    <path d="M36 62 100 4l64 58Z" fill="url(#roof)" stroke="#bd9e6c" stroke-width="5"/>
    <path d="M82 166v-45c0-24 36-24 36 0v45Z" fill="#181b21"/>
    <circle cx="100" cy="74" r="18" fill="#d9bd68" stroke="#f6e6ad" stroke-width="4"/>
    <path d="M100 56v36M82 74h36" stroke="#4d3c28" stroke-width="4"/>
    <path d="M8 164h184l18 28H-10Z" fill="#5e4e3b" stroke="#9e8965" stroke-width="4"/>
  </g>

  <!-- School wing -->
  <g transform="translate(120 88)" filter="url(#shadow)">
    <ellipse cx="165" cy="144" rx="170" ry="36" fill="#30291f" opacity=".25"/>
    <path d="M20 120h290v82H20Z" fill="url(#stone)" stroke="#b39d78" stroke-width="4"/>
    <path d="M8 118 72 58h186l64 60Z" fill="url(#roof)" stroke="#c1a875" stroke-width="4"/>
    <path d="M86 70V18h24v52M220 70V18h24v52" fill="#544936" stroke="#c1a875" stroke-width="4"/>
    <path d="M165 48 198 79h-66Z" fill="#d4b65f"/>
    <g fill="#d8c8a0">
      <rect x="48" y="136" width="30" height="48" rx="7"/>
      <rect x="110" y="136" width="30" height="48" rx="7"/>
      <rect x="190" y="136" width="30" height="48" rx="7"/>
      <rect x="252" y="136" width="30" height="48" rx="7"/>
    </g>
    <g stroke="#c95f44" stroke-width="8">
      <path d="M56 28v64"/><path d="M274 28v64"/>
    </g>
  </g>

  <!-- Library / observatory -->
  <g transform="translate(848 74)" filter="url(#shadow)">
    <ellipse cx="115" cy="158" rx="128" ry="34" fill="#30291f" opacity=".25"/>
    <path d="M38 112h154v94H38Z" fill="url(#stone)" stroke="#a9997b" stroke-width="4"/>
    <path d="M26 110h178L168 72H62Z" fill="url(#tealRoof)" stroke="#a9997b" stroke-width="4"/>
    <circle cx="115" cy="62" r="46" fill="#28454a" stroke="#c1ac7c" stroke-width="6"/>
    <path d="M115 16v92M69 62h92M82 29l66 66M148 29 82 95" stroke="#d8c885" stroke-width="3" opacity=".74"/>
    <path d="M101 206v-48c0-20 28-20 28 0v48Z" fill="#1b2223"/>
    <circle cx="115" cy="62" r="9" fill="#e1c86f"/>
  </g>

  <!-- Forge volcano -->
  <g transform="translate(72 430)" filter="url(#shadow)">
    <ellipse cx="128" cy="138" rx="150" ry="40" fill="#241d19" opacity=".3"/>
    <path d="m8 166 74-142 55 92 45-64 68 114Z" fill="#4c4139" stroke="#6f5d48" stroke-width="5"/>
    <path d="m62 80 20-56 24 40 15-12 16 64Z" fill="url(#lava)" opacity=".96"/>
    <path d="M112 154h98v62h-98Z" fill="#342f2a" stroke="#957d59" stroke-width="4"/>
    <path d="m102 154 59-54 59 54Z" fill="#62372c" stroke="#b27c50" stroke-width="4"/>
    <rect x="137" y="173" width="48" height="43" rx="8" fill="#1f1714"/>
    <circle cx="161" cy="193" r="20" fill="url(#lava)"/>
    <path d="M42 10c-12-24 20-31 13-55M90 6c-10-22 17-28 11-49" fill="none" stroke="#6b5d55" stroke-width="14" stroke-linecap="round" opacity=".55" filter="url(#soft)"/>
  </g>

  <!-- Trial bastion -->
  <g transform="translate(340 548)" filter="url(#shadow)">
    <ellipse cx="104" cy="105" rx="128" ry="34" fill="#30291f" opacity=".26"/>
    <path d="M8 76h192v122H8Z" fill="url(#stone)" stroke="#a9997b" stroke-width="4"/>
    <path d="M8 72h44V38h34v34h36V38h34v34h44v28H8Z" fill="#51483a" stroke="#a9997b" stroke-width="4"/>
    <path d="M76 198v-66c0-30 56-30 56 0v66Z" fill="#171a1c"/>
    <path d="m52 112 18 18m0-18-18 18m86-18 18 18m0-18-18 18" stroke="#d9c78f" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Arena -->
  <g transform="translate(908 438)" filter="url(#shadow)">
    <ellipse cx="115" cy="122" rx="145" ry="94" fill="#4d4336" stroke="#b6a179" stroke-width="8"/>
    <ellipse cx="115" cy="122" rx="100" ry="58" fill="#b49a68" stroke="#6d5c42" stroke-width="8"/>
    <ellipse cx="115" cy="122" rx="58" ry="30" fill="#89714d"/>
    <path d="M0 122h230M115 28v188" stroke="#d0b77e" stroke-width="5" opacity=".65"/>
    <g fill="#3e372f" stroke="#b6a179" stroke-width="4">
      <rect x="-4" y="74" width="28" height="96" rx="8"/>
      <rect x="206" y="74" width="28" height="96" rx="8"/>
    </g>
  </g>

  <!-- Arcane details -->
  <g fill="none" stroke="#e2c96e" stroke-width="3" opacity=".5">
    <circle cx="605" cy="392" r="150" stroke-dasharray="7 12"/>
    <circle cx="605" cy="392" r="176" stroke-dasharray="2 18"/>
    <path d="m605 208 18 32 36 7-26 25 6 36-34-17-34 17 6-36-26-25 36-7Z"/>
  </g>
  <g fill="#f3de91" opacity=".55">
    <circle cx="458" cy="342" r="4"/><circle cx="735" cy="315" r="4"/><circle cx="702" cy="492" r="5"/>
    <circle cx="362" cy="474" r="3"/><circle cx="813" cy="417" r="3"/><circle cx="282" cy="350" r="4"/>
  </g>
</svg>